name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DRDE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/RecklessDeEsser_artefacts/Release/AU/Reckless DeEsser.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Rdes Rckl

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            "build/RecklessDeEsser_artefacts/Release/VST3/Reckless DeEsser.vst3"

      - name: Package
        run: |
          mkdir -p dist
          cd build/RecklessDeEsser_artefacts/Release
          ditto -c -k --keepParent "VST3/Reckless DeEsser.vst3" "$GITHUB_WORKSPACE/dist/RecklessDeEsser-macOS-VST3.zip"
          ditto -c -k --keepParent "AU/Reckless DeEsser.component" "$GITHUB_WORKSPACE/dist/RecklessDeEsser-macOS-AU.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: RecklessDeEsser-macOS
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate VST3 (pluginval)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process "build/RecklessDeEsser_artefacts/Release/VST3/Reckless DeEsser.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/RecklessDeEsser_artefacts/Release/VST3/Reckless DeEsser.vst3" -DestinationPath dist/RecklessDeEsser-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RecklessDeEsser-Windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
